name: terraform

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# id-token: write lets the job ask GitHub for an OIDC token
permissions:
  id-token: write
  contents: read
  pull-requests: write

# Never run two Terraform jobs at the same time
concurrency:
  group: terraform-pg-lab
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_VERSION: "1.17.1"
  AWS_REGION: us-east-1

jobs:
  plan:
    name: Plan (pull request)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Log in to AWS with OIDC (read-only role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Format check
        run: terraform fmt -check -recursive

      - name: Init
        run: terraform init -input=false

      - name: Validate
        run: terraform validate -no-color

      - name: Plan
        id: plan
        run: terraform plan -input=false -no-color -lock-timeout=5m -out=tfplan | tee plan.txt

      - name: Post plan to the pull request
        if: always() && steps.plan.outcome != 'skipped'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let plan = fs.existsSync('plan.txt') ? fs.readFileSync('plan.txt', 'utf8') : 'No plan output.';
            const max = 60000;
            if (plan.length > max) plan = '...(truncated)\n' + plan.slice(-max);
            const body = [
              '### Terraform plan: `${{ steps.plan.outcome }}`',
              '',
              '<details><summary>Show plan</summary>',
              '',
              '```',
              plan,
              '```',
              '</details>',
            ].join('\n');
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body,
            });

  apply:
    name: Apply (main)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Log in to AWS with OIDC (apply role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Init
        run: terraform init -input=false

      - name: Plan
        run: terraform plan -input=false -no-color -lock-timeout=5m -out=tfplan

      - name: Apply the saved plan
        run: terraform apply -input=false -no-color -lock-timeout=5m tfplan
