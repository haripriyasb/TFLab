name: terraform

run-name: terraform ${{ inputs.action }} ${{ inputs.environment }}

# Runs only when you click "Run workflow" in the Actions tab.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment"
        type: choice
        options:
          - dev
          - prod
        default: dev
      action:
        description: "What to run"
        type: choice
        options:
          - plan
          - apply
        default: plan

permissions:
  id-token: write
  contents: read

# One Terraform run at a time per environment
concurrency:
  group: terraform-pg-lab-${{ inputs.environment }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_VERSION: "1.17.1"
  AWS_REGION: us-east-1
  # The dropdown value, used for the state key AND the YAML config
  TF_VAR_environment: ${{ inputs.environment }}

jobs:
  terraform:
    name: ${{ inputs.action }} ${{ inputs.environment }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # plan -> read-only role, apply -> apply role
      - name: Log in to AWS with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.action == 'apply' && vars.AWS_APPLY_ROLE_ARN || vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Format check
        run: terraform fmt -check -recursive

      # Picks this environment's state file
      - name: Init (${{ inputs.environment }} state)
        run: terraform init -input=false -backend-config=backends/${{ inputs.environment }}.s3.tfbackend

      - name: Validate
        run: terraform validate -no-color

      # Reads config/<environment>.yaml through TF_VAR_environment
      - name: Plan
        run: terraform plan -input=false -no-color -lock-timeout=5m -out=tfplan | tee plan.txt

      - name: Add plan to the run summary
        if: always()
        run: |
          {
            echo "## Terraform plan: ${{ inputs.environment }} (${{ inputs.action }} run)"
            echo
            echo '```'
            if [ -f plan.txt ]; then tail -c 60000 plan.txt; else echo "No plan output."; fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Apply the saved plan
        if: inputs.action == 'apply'
        run: terraform apply -input=false -no-color -lock-timeout=5m tfplan
