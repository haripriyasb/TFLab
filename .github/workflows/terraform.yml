name: terraform

# Runs only when you click "Run workflow" in the Actions tab.
# Pushing code does not start it.
on:
  workflow_dispatch:
    inputs:
      action:
        description: "What to run"
        type: choice
        options:
          - plan
          - apply
        default: plan

# id-token: write lets the job ask GitHub for an OIDC token
permissions:
  id-token: write
  contents: read

# Never run two Terraform jobs at the same time
concurrency:
  group: terraform-pg-lab
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_VERSION: "1.17.1"
  AWS_REGION: us-east-1

jobs:
  terraform:
    name: terraform ${{ inputs.action }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # plan -> read-only role, apply -> apply role
      - name: Log in to AWS with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.action == 'apply' && vars.AWS_APPLY_ROLE_ARN || vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Format check
        run: terraform fmt -check -recursive

      - name: Init
        run: terraform init -input=false

      - name: Validate
        run: terraform validate -no-color

      - name: Plan
        run: terraform plan -input=false -no-color -lock-timeout=5m -out=tfplan | tee plan.txt

      # Shows the plan on the run's Summary page
      - name: Add plan to the run summary
        if: always()
        run: |
          {
            echo "## Terraform plan (${{ inputs.action }} run)"
            echo
            echo '```'
            if [ -f plan.txt ]; then tail -c 60000 plan.txt; else echo "No plan output."; fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Apply the saved plan
        if: inputs.action == 'apply'
        run: terraform apply -input=false -no-color -lock-timeout=5m tfplan
